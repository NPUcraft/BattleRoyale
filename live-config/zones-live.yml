config-version: 2
profiles:
  default:
    initial-size-by-players:
    - max-players: 4
      half-size: 200
    - max-players: 8
      half-size: 300
    - max-players: 16
      half-size: 500
    - max-players: 32
      half-size: 750
    stages:
