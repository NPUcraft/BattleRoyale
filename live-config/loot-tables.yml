config-version: 2
auto-containers:
  enabled: true
  loot-table: native-basic
  chance: 0.15
  min-rolls: 1
  max-rolls: 2
  max-containers-per-tick: 16
airdrops:
  enabled: true
  loot-table: airdrop
  # 分轮阶梯：第 N 轮整体比当期地面最高级高半档，保底装备也随轮升级（铁 -> 铁中带钻 -> 钻）。
  round-tables: [airdrop-1, airdrop-2, airdrop-3, airdrop-4]
  min-rolls: 6
  max-rolls: 8
  # 公示 60 + 下落 20 = 80 秒，必须小于最短缩圈阶段的总时长（wait 60 + shrink 25 = 85），
  # 否则空投会跨阶段落地、被投进下一圈之外的死区（生产的落点校验比对的是选点时的快照，查不出这种偏移）。
  # 调整公示时长前先核对该契约：announcement-seconds + fall-seconds < min(wait-seconds + shrink-seconds)。
  fall-seconds: 20
  max-attempts: 24
  marker-seconds: 120
  announcement-seconds: 60
  min-distance: 128
mob-loot:
  enabled: true
  loot-table: survival
  chance: 0.35
  min-rolls: 1
  max-rolls: 1
  max-drops-per-session: 64
  per-player-cooldown-seconds: 10
horses:
  enabled: true
  max-per-session: 16
  interval-seconds: 15
  max-attempts: 24
  min-distance: 64
# Staged ground supplies: a low-tier opening table fixed at generation, then higher-tier refills
# seeded into the future safe zone when each shrinking stage begins.
ground-loot:
  enabled: true
  initial-table: ground-early
  # 郊区开局低级；村庄等人造建筑周边开局直接中级。缩圈二刷同样看地形：郊区补中级、市区补高级。
  built-initial-table: ground-mid
  refills:
    - { after-stage: 1, table: ground-mid, built-table: ground-late, points: 12 }
    - { after-stage: 2, table: ground-mid, built-table: ground-late, points: 10 }
    - { after-stage: 3, table: ground-late, built-table: ground-late, points: 8 }
  # 补给点稀有度粒子配色：青绿=低级，琥珀=中级，绯红=高级。
  signal-tiers:
    - { table: ground-early, tier: low }
    - { table: ground-mid, tier: mid }
    - { table: ground-late, tier: high }
