config-version: 2
# Recovery and permanent progression share the versioned SQLite/MySQL database.
debug: false
disconnect:
  reconnect-seconds: 120
  mob-aggro:
    enabled: true
    radius: 24
    interval-ticks: 20
combat:
  attribution-seconds: 15
  assist:
    min-damage: 4.0
    min-damage-share: 0.20
match:
  winner-showcase-seconds: 60
deathbox:
  interaction-distance: 6.0
storage:
  type: sqlite
  sqlite:
    file: data/lastsector.db
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: lastsector
    username: lastsector
    password: ""
    connection-timeout-ms: 5000
recovery:
  enabled: true
  checkpoint-seconds: 5
  orphan-delete-after-minutes: 60
economy:
  provider: auto
  auto-priority: [coinsengine, excellenteconomy, vault]
  currency: coins
  shop-enabled: true
# Relative to plugins/LastSector. Must also be inside Paper's world container.
runtime-worlds:
  directory: runtime
lobby:
  world: world
  use-world-spawn: true
zone-ui:
  bossbar:
    enabled: true
    update-interval-ticks: 5
  particle-wall:
    enabled: true
    particle: END_ROD
    interval-ticks: 5
    view-distance: 64
    spacing: 2.5
    vertical-spacing: 1.5
    height-below-player: 3
    height-above-player: 6
    max-particles-per-player: 300

# Async chunk generation is bounded per maintenance operation.
map-maintenance:
  pregeneration:
    max-concurrent-chunks: 8
