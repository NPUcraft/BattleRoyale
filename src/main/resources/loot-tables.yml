config-version: 2
# Map-authored empty storage containers are considered once per match, inside the initial zone.
auto-containers:
  enabled: true
  loot-table: basic
  chance: 0.4
  min-rolls: 1
  max-rolls: 3
  max-containers-per-tick: 16
# One supply crate when each shrinking phase starts. Locations are broadcast to that match world.
airdrops:
  enabled: true
  loot-table: airdrop
  min-rolls: 8
  max-rolls: 12
  fall-seconds: 8
  max-attempts: 24
  marker-seconds: 120
mob-loot:
  enabled: true
  loot-table: basic
  chance: 0.35
  min-rolls: 1
  max-rolls: 1
  max-drops-per-session: 64
  per-player-cooldown-seconds: 10
horses:
  enabled: true
  max-per-session: 16
  interval-seconds: 15
  max-attempts: 24
  min-distance: 64
