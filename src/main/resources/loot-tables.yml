config-version: 2
# Map-authored empty storage containers are considered once per match, inside the initial zone.
auto-containers:
  enabled: true
  loot-table: native-basic
  chance: 0.15
  min-rolls: 1
  max-rolls: 2
  max-containers-per-tick: 16
# One immutable 4x4 surface sample per loaded chunk/session; no neighbour chunk loads.
# Regional entries preserve the caller's roll count and use only ordinary low-tier enchanting.
region-quality:
  enabled: true
  built-threshold: 0.25
  natural-table: region-natural
  built-table: region-built
# Staged ground supplies: a low-tier opening table fixed at generation, then higher-tier refills
# seeded into the future safe zone when each shrinking stage begins.
ground-loot:
  enabled: true
  initial-table: ground-early
  refills:
    - { after-stage: 1, table: ground-mid, points: 3 }
    - { after-stage: 2, table: ground-mid, points: 3 }
    - { after-stage: 3, table: ground-late, points: 2 }
# One supply crate when each shrinking phase starts. Locations are broadcast to that match world.
airdrops:
  enabled: true
  loot-table: airdrop
  min-rolls: 6
  max-rolls: 8
  fall-seconds: 8
  max-attempts: 24
  marker-seconds: 120
  announcement-seconds: 120
  min-distance: 128
mob-loot:
  enabled: true
  loot-table: basic
  chance: 0.35
  min-rolls: 1
  max-rolls: 1
  max-drops-per-session: 64
  per-player-cooldown-seconds: 10
horses:
  enabled: true
  max-per-session: 16
  interval-seconds: 15
  max-attempts: 24
  min-distance: 64
loot-tables:
