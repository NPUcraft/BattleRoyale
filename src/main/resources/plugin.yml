name: LastSector
version: '${version}'
main: com.npucraft.lastsector.LastSectorPlugin
api-version: '1.21.8'
description: Multiplayer battle royale with safe map authoring and release diagnostics - Milestone 9
load: POSTWORLD
commands:
  lastsector:
    description: LastSector administration
    aliases: [ls]
    usage: /lastsector help
permissions:
  lastsector.command:
    description: Access help and version
    default: true
  lastsector.admin:
    description: Access reload and debug
    default: op
    children:
      lastsector.command: true
      lastsector.play: true
      lastsector.admin.map: true
      lastsector.admin.config: true
      lastsector.admin.cosmetic: true
      lastsector.admin.diagnostics: true
  lastsector.play:
    description: List, join and leave waiting rooms
    default: true

  lastsector.admin.map:
    description: Map editor, validation and maintenance
    default: op
  lastsector.admin.config:
    description: Configuration diagnostics and backups
    default: op
  lastsector.admin.cosmetic:
    description: Cosmetic grants and purchase diagnostics
    default: op
  lastsector.admin.diagnostics:
    description: Diagnostics and support bundles
    default: op

softdepend: [CoinsEngine, ExcellentEconomy, Vault]
