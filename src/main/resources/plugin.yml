name: BattleRoyale
version: '${version}'
main: com.npucraft.battleroyale.BattleRoyalePlugin
api-version: '26.2'
description: Multiplayer battle royale with safe map authoring and release diagnostics - Milestone 9
load: POSTWORLD
commands:
  battleroyale:
    description: BattleRoyale administration
    aliases: [br]
    usage: /battleroyale help
permissions:
  battleroyale.command:
    description: Access help and version
    default: true
  battleroyale.admin:
    description: Access reload and debug
    default: op
    children:
      battleroyale.command: true
      battleroyale.play: true
      battleroyale.admin.map: true
      battleroyale.admin.config: true
      battleroyale.admin.cosmetic: true
      battleroyale.admin.diagnostics: true
  battleroyale.play:
    description: List, join and leave waiting rooms
    default: true

  battleroyale.admin.map:
    description: Map editor, validation and maintenance
    default: op
  battleroyale.admin.config:
    description: Configuration diagnostics and backups
    default: op
  battleroyale.admin.cosmetic:
    description: Cosmetic grants and purchase diagnostics
    default: op
  battleroyale.admin.diagnostics:
    description: Diagnostics and support bundles
    default: op

softdepend: [CoinsEngine, ExcellentEconomy, Vault]
